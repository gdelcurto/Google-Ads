services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: google-ads-backend
    env_file: .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/db.sqlite3
    volumes:
      - ./data:/app/data          # SQLite DB + exports
      - ./examples:/app/examples  # brief examples (read-only)
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: google-ads-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes: {}
