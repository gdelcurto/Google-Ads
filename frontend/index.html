<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google Ads — Blastness</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --primary-color:       #e10098;
        --secondary-color:     #f8f4f0;
        --text-color:          #000;
        --text-color-grigio:   #a6a6a6;
        --color-sfondo:        #efefef;
        --color-grigio-chiaro: #ebebeb;
        --color-grigio-scuro:  #e1e1e1;
        --color-blue:          #576a8f;
        --color-light-blue:    #697a9b;
        --color-yellow:        #d6de85;
        --color-dark-yellow:   #d6de85;
      }
      body {
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
        background: #fff;
        color: var(--text-color);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      input, select, textarea, button {
        font-family: inherit;
      }
      @page { margin: 1.5cm; }
      @media print {
        body * { visibility: hidden !important; }
        #action-plan-print, #action-plan-print * { visibility: visible !important; }
        #action-plan-print {
          position: absolute !important;
          left: 0 !important; top: 0 !important;
          width: 100% !important; max-width: none !important;
          margin: 0 !important; padding: 0 !important;
          box-shadow: none !important;
        }
        .no-print { display: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
